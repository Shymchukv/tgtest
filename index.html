<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розумний Дім</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Підключаємо сучасний шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #000000);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }
        .header p {
            margin: 5px 0 0;
            font-size: 15px;
            color: #8e8e93;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 22px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            height: 110px;
            box-sizing: border-box;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card:active {
            transform: scale(0.92);
            opacity: 0.8;
        }
        .icon {
            font-size: 32px;
        }
        .title {
            font-size: 16px;
            font-weight: 600;
        }
        /* Стилі для конкретних карток */
        .card.light-on { background: linear-gradient(135deg, #32D74B, #28a745); color: #fff; }
        .card.light-off { background: linear-gradient(135deg, #FF453A, #dc3545); color: #fff; }
        .card.climate { background: linear-gradient(135deg, #0A84FF, #007bff); color: #fff; }
        .card.gas { background: linear-gradient(135deg, #FF9F0A, #fd7e14); color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Мій Дім</h1>
        <p>Панель керування</p>
    </div>

    <div class="grid">
        <div class="card light-on" onclick="sendCommand('light_on')">
            <div class="icon">💡</div>
            <div class="title">Увімкнути</div>
        </div>
        <div class="card light-off" onclick="sendCommand('light_off')">
            <div class="icon">🌑</div>
            <div class="title">Вимкнути</div>
        </div>
        <div class="card climate" onclick="sendCommand('climate')">
            <div class="icon">🌡️</div>
            <div class="title">Клімат</div>
        </div>
        <div class="card gas" onclick="sendCommand('gas')">
            <div class="icon">💨</div>
            <div class="title">Стан Газу</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Відкриває апку на весь екран
        
        // ⚠️ НЕ ЗАБУДЬ ВПИСАТИ СВІЙ ЮЗЕРНЕЙМ БОТА ТУТ (без @)
        const botUsername = "@homenemkkursbot";

        function sendCommand(cmd) {
            let url = "https://t.me/" + botUsername + "?start=" + cmd;
            tg.openTelegramLink(url);
        }
    </script>
</body>
</html>
