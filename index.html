<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розумний Дім</title>
    
    <!-- Підключення Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

        // Твої ключі
        const firebaseConfig = {
            apiKey: "AIzaSyAHS9DrfOO9qS4GY1rbmgO4KDMaJphhjYs",
            databaseURL: "https://vlad-b0870-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vlad-b0870"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Посилання на конкретні комірки в базі
        const dbRef = {
            light: ref(db, 'home/light'),
            door: ref(db, 'home/door'),
            armed: ref(db, 'home/armed'),
            temp: ref(db, 'home/temperature'),
            hum: ref(db, 'home/humidity'),
            gas: ref(db, 'home/gas')
        };

        // Локальні змінні
        let state = { light: false, door: false, armed: false };

        // ЗЧИТУВАННЯ: Автоматично оновлюємо цифри на екрані при зміні в базі
        onValue(dbRef.temp, (snap) => { document.getElementById('valTemp').innerText = snap.val() ? snap.val() + " °C" : "-- °C"; });
        onValue(dbRef.hum, (snap) => { document.getElementById('valHum').innerText = snap.val() ? snap.val() + " %" : "-- %"; });
        onValue(dbRef.gas, (snap) => { 
            let gasLvl = snap.val();
            document.getElementById('valGas').innerText = gasLvl > 2000 ? "⚠️ НЕБЕЗПЕКА (" + gasLvl + ")" : "✅ В нормі";
            document.getElementById('valGas').style.color = gasLvl > 2000 ? "#ff4040" : "#4facfe";
        });

        // Оновлюємо вигляд кнопок залежно від стану
        onValue(dbRef.light, (snap) => { 
            state.light = snap.val(); 
            document.getElementById('txtLight').innerText = state.light ? "Світло: УВІМК" : "Світло: ВИМК";
            document.getElementById('cardLight').style.background = state.light ? "rgba(255, 200, 0, 0.2)" : "rgba(255, 255, 255, 0.05)";
        });
        onValue(dbRef.door, (snap) => { 
            state.door = snap.val(); 
            document.getElementById('txtDoor').innerText = state.door ? "Двері: ВІДКРИТІ" : "Двері: ЗАКРИТІ";
            document.getElementById('cardDoor').style.background = state.door ? "rgba(0, 255, 100, 0.2)" : "rgba(255, 255, 255, 0.05)";
        });
        onValue(dbRef.armed, (snap) => { 
            state.armed = snap.val(); 
            document.getElementById('txtArm').innerText = state.armed ? "Охорона: АКТИВНА 🔴" : "Охорона: ВИМКНЕНА";
            document.getElementById('cardArm').style.background = state.armed ? "rgba(255, 0, 0, 0.3)" : "rgba(255, 255, 255, 0.05)";
        });

        // ЗАПИС: Відправка команд у базу при кліку
        window.toggleLight = () => set(dbRef.light, !state.light);
        window.toggleDoor = () => set(dbRef.door, !state.door);
        window.toggleArm = () => set(dbRef.armed, !state.armed);
    </script>

    <style>
        body { background-color: #1a1a2e; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        
        .climate-box { background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .climate-box h3 { margin: 0 0 15px 0; font-size: 18px; text-align: center; }
        .climate-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
        .climate-row span { font-weight: bold; color: #4facfe; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .card:active { transform: scale(0.95); }
        .icon-wrapper { font-size: 30px; margin-bottom: 10px; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; border-radius: 50%; }
        .card span { font-size: 14px; font-weight: 600; text-align: center; }
        .full-width { grid-column: 1 / -1; }
        
        .light .icon-wrapper { background: linear-gradient(135deg, #f6d365, #fda085); }
        .door .icon-wrapper { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .arm .icon-wrapper { background: linear-gradient(135deg, #ff0040, #b30000); }
    </style>
</head>
<body>
    <div class="container">
        <div class="climate-box">
            <h3>📊 Дані в реальному часі</h3>
            <div class="climate-row">🌡 Температура: <span id="valTemp">-- °C</span></div>
            <div class="climate-row">💧 Вологість: <span id="valHum">-- %</span></div>
            <div class="climate-row">💨 Газ: <span id="valGas">--</span></div>
        </div>

        <div class="grid">
            <div class="card light" id="cardLight" onclick="toggleLight()">
                <div class="icon-wrapper">💡</div>
                <span id="txtLight">Світло: ВИМК</span>
            </div>
            
            <div class="card door" id="cardDoor" onclick="toggleDoor()">
                <div class="icon-wrapper">🚪</div>
                <span id="txtDoor">Двері: ЗАКРИТІ</span>
            </div>

            <div class="card arm full-width" id="cardArm" onclick="toggleArm()">
                <div class="icon-wrapper">🛡</div>
                <span id="txtArm">Охорона: ВИМКНЕНА</span>
            </div>
        </div>
    </div>
</body>
</html>
