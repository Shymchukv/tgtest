<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розумний Дім — Панель Керування</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 20px; }
        .dashboard { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .card h3 { font-size: 1.1rem; color: #94a3b8; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .value { font-size: 2.2rem; font-weight: bold; color: #38bdf8; }
        .unit { font-size: 1rem; color: #64748b; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-on { background: #22c55e; color: #fff; }
        .btn-on:hover { background: #16a34a; }
        .btn-off { background: #ef4444; color: #fff; }
        .btn-off:hover { background: #dc2626; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .badge-ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .header { grid-column: 1 / -1; text-align: center; padding: 10px 0 20px 0; }
        .header h1 { font-size: 1.8rem; color: #f8fafc; }
        .header p { color: #64748b; font-size: 0.9rem; }
    </style>
    <!-- Firebase JS SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h1>🏡 Розумний Дім (ESP32)</h1>
        <p>Панель моніторингу та віддаленого керування в реальному часі</p>
    </div>

    <!-- Температура -->
    <div class="card">
        <h3>🌡 Температура</h3>
        <div class="value" id="temp">-- <span class="unit">°C</span></div>
    </div>

    <!-- Вологість -->
    <div class="card">
        <h3>💧 Вологість</h3>
        <div class="value" id="hum">-- <span class="unit">%</span></div>
    </div>

    <!-- Рівень газу -->
    <div class="card">
        <h3>💨 Рівень газу</h3>
        <div class="value" id="gas">-- <span class="unit">/ 4095</span></div>
        <div style="margin-top: 10px;" id="gasStatus"><span class="status-badge badge-ok">Норма</span></div>
    </div>

    <!-- Дверний замок -->
    <div class="card">
        <h3>🚪 Дверний замок</h3>
        <div id="doorStatus" style="margin-bottom: 10px;"><span class="status-badge badge-ok">Зачинено</span></div>
        <button class="btn btn-on" onclick="togglePath('/home/door')">Змінити стан дверей</button>
    </div>

    <!-- Фасадне світло -->
    <div class="card">
        <h3>🌳 Фасадне світло</h3>
        <div id="outdoorStatus" style="margin-bottom: 10px;"><span class="status-badge badge-off">Вимкнено</span></div>
        <button class="btn btn-on" onclick="togglePath('/home/light_outdoor')">Переключити фасад</button>
    </div>

    <!-- Кімнатне світло -->
    <div class="card">
        <h3>🏠 Кімнатне світло</h3>
        <div id="indoorStatus" style="margin-bottom: 10px;"><span class="status-badge badge-off">Вимкнено</span></div>
        <button class="btn btn-on" onclick="togglePath('/home/light_indoor')">Переключити кімнату</button>
    </div>

    <!-- Режим охорони -->
    <div class="card">
        <h3>🛡 Система охорони</h3>
        <div id="armedStatus" style="margin-bottom: 10px;"><span class="status-badge badge-off">Деактивовано</span></div>
        <button class="btn btn-off" onclick="togglePath('/home/armed')">Переключити охорону</button>
    </div>
</div>

<script>
    // Конфігурація Firebase
    const firebaseConfig = {
        databaseURL: "https://vlad-b0870-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Зчитування даних у реальному часі
    database.ref('/home/temperature').on('value', snap => { document.getElementById('temp').innerHTML = (snap.val() || '--') + ' <span class="unit">°C</span>'; });
    database.ref('/home/humidity').on('value', snap => { document.getElementById('hum').innerHTML = (snap.val() || '--') + ' <span class="unit">%</span>'; });
    
    database.ref('/home/gas').on('value', snap => {
        const val = snap.val() || 0;
        document.getElementById('gas').innerHTML = val + ' <span class="unit">/ 4095</span>';
        const st = document.getElementById('gasStatus');
        if (val > 2000) {
            st.innerHTML = '<span class="status-badge badge-danger">⚠️ НЕБЕЗПЕКА ГАЗУ!</span>';
        } else {
            st.innerHTML = '<span class="status-badge badge-ok">✅ В нормі</span>';
        }
    });

    database.ref('/home/door').on('value', snap => {
        const val = snap.val();
        document.getElementById('doorStatus').innerHTML = val ? '<span class="status-badge badge-danger">🔓 Відчинено</span>' : '<span class="status-badge badge-ok">🔒 Зачинено</span>';
    });

    database.ref('/home/light_outdoor').on('value', snap => {
        const val = snap.val();
        document.getElementById('outdoorStatus').innerHTML = val ? '<span class="status-badge badge-ok">💡 Увімкнено</span>' : '<span class="status-badge badge-off">⚫ Вимкнено</span>';
    });

    database.ref('/home/light_indoor').on('value', snap => {
        const val = snap.val();
        document.getElementById('indoorStatus').innerHTML = val ? '<span class="status-badge badge-ok">💡 Увімкнено</span>' : '<span class="status-badge badge-off">⚫ Вимкнено</span>';
    });

    database.ref('/home/armed').on('value', snap => {
        const val = snap.val();
        document.getElementById('armedStatus').innerHTML = val ? '<span class="status-badge badge-danger">🛡 Під охороною</span>' : '<span class="status-badge badge-ok">🔓 Знято з охорони</span>';
    });

    // Перемикання станів прапорців
    function togglePath(path) {
        database.ref(path).once('value').then(snap => {
            database.ref(path).set(!snap.val());
        });
    }
</script>
</body>
</html>
