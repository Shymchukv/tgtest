<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розумний Дім</title>
    <!-- Підключаємо офіційну бібліотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2a82d6);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 16px;
            margin: 8px 0;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .gas-btn { 
            background-color: #e53935; /* Червона кнопка для газу */
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">🏠 Пульт Управління</div>

    <button class="btn" onclick="sendCommand('light_on')">🟢 Увімкнути світло</button>
    <button class="btn" onclick="sendCommand('light_off')">🔴 Вимкнути світло</button>
    <button class="btn" onclick="sendCommand('climate')">🌡 Клімат (Темп/Волога)</button>
    <button class="btn gas-btn" onclick="sendCommand('gas')">💨 Перевірити Газ</button>

    <script>
        // Ініціалізуємо додаток
        let tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо апку на весь екран при відкритті

        // ⚠️ ВАЖЛИВО: Впиши сюди юзернейм свого бота БЕЗ @
        const botUsername = "@homenemkkursbot";

        function sendCommand(cmd) {
            // Формуємо приховане посилання. 
            // Воно закриє апку і відправить боту команду (наприклад, /start light_on)
            let url = `https://t.me/${botUsername}?start=${cmd}`;
            tg.openTelegramLink(url);
        }
    </script>
</body>
</html>
